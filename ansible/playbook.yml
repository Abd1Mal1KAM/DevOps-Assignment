- name: Configure web servers
  hosts: web
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Python and pip
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
        state: present

    - name: Copy application files
      ansible.builtin.copy:
        src: ../app/
        dest: /home/ubuntu/app/
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Upgrade pip3
      ansible.builtin.pip:
        name: pip
        executable: pip3
        state: present
        extra_args: "--upgrade"

    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: /home/ubuntu/app/requirements.txt
        executable: pip3
        extra_args: --break-system-packages

    - name: Create systemd service for Streamlit app
      ansible.builtin.copy:
        dest: /etc/systemd/system/streamlit-app.service
        content: |
          [Unit]
          Description=Streamlit App Service
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 -m streamlit run /home/ubuntu/app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
          Restart=always
          User=ubuntu
          WorkingDirectory=/home/ubuntu/app

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
        owner: root
        group: root

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start Streamlit app
      ansible.builtin.systemd:
        name: streamlit-app
        enabled: true
        state: started
