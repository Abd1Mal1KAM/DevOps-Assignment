- hosts: web
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Python and pip
      apt:
        name:
          - python3
          - python3-pip
        state: present

    - name: Copy application files
      copy:
        src: ../app/
        dest: /home/ubuntu/app/
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Install Python dependencies
      pip:
        requirements: /home/ubuntu/app/requirements.txt
        executable: pip3

    - name: Create systemd service for Streamlit app
      copy:
        dest: /etc/systemd/system/streamlit-app.service
        content: |
          [Unit]
          Description=Streamlit App Service
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 -m streamlit run /home/ubuntu/app/app.py --server.port 8501 --server.address 0.0.0.0
          Restart=always
          User=ubuntu
          WorkingDirectory=/home/ubuntu/app

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable and start Streamlit app
      systemd:
        name: streamlit-app
        enabled: yes
        state: started